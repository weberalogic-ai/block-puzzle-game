<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f"><meta name="description" content="Play Weberalogic Block Puzzle online.">
<title>Block Puzzle — Weberalogic</title><link rel="stylesheet" href="style.css">
</head>
<body><main class="app">
<header class="topbar"><div><p class="eyebrow">WEBERALOGIC</p><h1>Block Puzzle</h1></div><button id="newGameBtn" class="icon-btn" type="button">↻</button></header>
<section class="stats"><div class="stat"><span>SCORE</span><strong id="score">0</strong></div><div class="stat"><span>BEST</span><strong id="best">0</strong></div></section>
<section class="game-card"><div class="board-title"><strong>10 × 10 BOARD</strong><span id="statusText">Choose a block below</span></div><div id="board" class="board" role="grid"></div>
<div id="message" class="message hidden" role="status"><div class="message-box"><span class="game-over-icon">✦</span><h2>Game Over</h2><p>Your score: <strong id="finalScore">0</strong></p><button id="playAgainBtn" class="primary-btn" type="button">Play Again</button></div></div></section>
<section class="pieces-panel"><div class="panel-heading"><h2>Your puzzle blocks</h2><span>Tap a block → place it</span></div><div id="pieces" class="pieces"></div></section>
<p class="hint">Complete a row or column to clear it. Use all 3 blocks to get 3 new blocks.</p>
</main><script src="script.js"></script></body></html>
